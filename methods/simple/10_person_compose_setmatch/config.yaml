method: per_person_clip_compose_setmatch
display_name: Per-Person CLIP Compose + Partial SetMatch
group: Simple / Obvious Baselines
cpr_supervision: 'No'
shared_protocol:
  method: groundingdino_clipreid_set
  method_dir: methods/simple/05_reid_set
  config: methods/simple/05_reid_set/config.yaml
clip:
  name: ViT-L/14
  checkpoint: checkpoints/clip/ViT-L-14.pt
  checkpoint_sha256: b8cca3fd41ae0c99ba7e8951adf17d267cdb84cd88be6f7c2e0eca1737a03836
composition:
  formula: normalize(alpha * target_crop_image + (1 - alpha) * modification_text)
  alpha_selection:
    mode: fixed
    fixed_alpha: 0.5
    metric: Full-mAP
    grid:
    - 0.0
    - 0.05
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    - 0.55
    - 0.6
    - 0.65
    - 0.7
    - 0.75
    - 0.8
    - 0.85
    - 0.9
    - 0.95
    - 1.0
    tie_break: smallest_alpha
    result: runs/per_person_clip_compose_setmatch/alpha_selection.json
    validation:
      gallery_manifest: data/validation/gallery.jsonl
      query_manifest: data/validation/queries.jsonl
localization:
  selector_text: subjects.select_text
  assignment: hungarian_max_sum
  require_distinct_persons: true
  detector:
    backend: groundingdino_swint_ogc
    source:
      repository: https://github.com/IDEA-Research/GroundingDINO.git
      commit: 856dde20aee659246248e20734ef9ba5214f5e44
      local_checkout: runs/groundingdino_clipreid_set/official_source/GroundingDINO
      auto_clone: true
    config: groundingdino/config/GroundingDINO_SwinT_OGC.py
    config_sha256: 172e80017f9395668a9cb5d1b8bd9d061c0e360471c6ed673c83b69bb14399f1
    checkpoint: checkpoints/groundingdino/groundingdino_swint_ogc.pth
    checkpoint_url: https://github.com/IDEA-Research/GroundingDINO/releases/download/v0.1.0-alpha/groundingdino_swint_ogc.pth
    runtime_cache: checkpoints/groundingdino/runtime_cache
    runtime_assets_marker: checkpoints/groundingdino/runtime_assets_ready.json
    text_prompt: person
    box_threshold: 0.35
    text_threshold: 0.25
    score_threshold: 0.35
    nms_iou_threshold: 0.5
    min_box_size_px: 4
    max_persons_per_image: 10
    batch_size: 2
    max_padding_ratio: 1.3
    attention_backend: official_pytorch_fallback
  query_selector:
    backend: openai_clip
    model: ViT-B/32
    source_commit: a1d071733d7111c9c014f024669f959182114e33
    checkpoint: checkpoints/clip/ViT-B-32.pt
    checkpoint_sha256: 40d365715913c9da98579312b702a82c18be219cc2a73407c4526f58eba950af
    checkpoint_url: https://openaipublic.azureedge.net/clip/models/40d365715913c9da98579312b702a82c18be219cc2a73407c4526f58eba950af/ViT-B-32.pt
    membership_threshold: 0.2
    membership_margin: 0.03
    max_members_per_subject: 5
    tokenize_truncate: true
    assignment: hungarian_anchors_then_disjoint_expansion
setmatch:
  pairwise_score: cosine_similarity
  assignment: hungarian_max_sum
  aggregation: mean
  unmatched_score: -1.0
  relational_text_behavior: full_instruction
  unmatched_score_source: analytic_lower_bound_of_normalized_cosine_or_token_cosine
runtime:
  device: cuda
  clip_image_batch_size: 128
  clip_text_batch_size: 256
  num_workers: 4
  feature_cache_dtype: float16
  score_feature_chunk_size: 65536
cache:
  main:
    detections: runs/groundingdino_clipreid_set/cache/person_detections.npz
    person_features: runs/per_person_clip_compose_setmatch/cache/main_person_features.npy
  validation:
    detections: runs/per_person_clip_compose_setmatch/cache/val_person_detections.npz
    person_features: runs/per_person_clip_compose_setmatch/cache/val_person_features.npy
data:
  gallery_manifest: data/gallery.jsonl
  query_manifest: data/queries.jsonl
output:
  dir: runs/per_person_clip_compose_setmatch
person_protocol: cpr_person/protocol.yaml
