method: groundingdino_clipreid_set
display_name: Grounding DINO + CLIP-ReID - Set
group: Simple / Obvious Baselines
cpr_supervision: 'No'

source:
  groundingdino:
    repository: https://github.com/IDEA-Research/GroundingDINO.git
    commit: 856dde20aee659246248e20734ef9ba5214f5e44
    local_checkout: runs/groundingdino_clipreid_set/official_source/GroundingDINO
    auto_clone: true
  clip_reid:
    repository: https://github.com/Syliz517/CLIP-ReID.git
    commit: eb1898b72c882875f478bebfc6d41644eece0a5d
    local_checkout: runs/groundingdino_clipreid_set/official_source/CLIP-ReID
    auto_clone: true

detector:
  name: Grounding DINO Swin-T
  config: groundingdino/config/GroundingDINO_SwinT_OGC.py
  checkpoint: checkpoints/groundingdino/groundingdino_swint_ogc.pth
  checkpoint_url: https://github.com/IDEA-Research/GroundingDINO/releases/download/v0.1.0-alpha/groundingdino_swint_ogc.pth
  checkpoint_status: OFFICIAL_RELEASED
  text_prompt: person
  box_threshold: 0.35
  text_threshold: 0.25
  nms_iou_threshold: 0.50
  min_box_size_px: 4
  max_persons_per_image: null
  runtime_cache: checkpoints/groundingdino/runtime_cache
  runtime_assets_marker: checkpoints/groundingdino/runtime_assets_ready.json

reid:
  name: CLIP-ReID ViT-B/16
  training_dataset: MSMT17
  official_config: configs/person/vit_clipreid.yml
  checkpoint: checkpoints/clip_reid/msmt17/ViT-B-16_60.pth
  checkpoint_drive_id: 1BVaZo93kOksYLjFNH3Gf7JxIbPlWSkcO
  checkpoint_source_url: https://drive.google.com/file/d/1BVaZo93kOksYLjFNH3Gf7JxIbPlWSkcO/view?usp=share_link
  checkpoint_status: OFFICIAL_RELEASED
  openai_clip_checkpoint: checkpoints/clip_reid/openai/ViT-B-16.pt
  num_classes: 1041
  camera_num: 15
  view_num: 1
  feature_dim: 1280
  input_size:
    - 256
    - 128
  pixel_mean:
    - 0.5
    - 0.5
    - 0.5
  pixel_std:
    - 0.5
    - 0.5
    - 0.5

setmatch:
  assignment: hungarian_max_sum
  aggregation: strict_minimum
  unmatched_score: -1.0
  query_person_set: all_predicted_persons
  gallery_person_set: all_predicted_persons

runtime:
  device: cuda
  reid_batch_size: 256
  feature_cache_dtype: float16
  score_feature_chunk_size: 65536

data:
  gallery_manifest: data/gallery.jsonl
  query_manifest: data/queries.jsonl

cache:
  detections: runs/groundingdino_clipreid_set/cache/person_detections.npz
  reid_features: runs/groundingdino_clipreid_set/cache/person_features.npy

output:
  dir: runs/groundingdino_clipreid_set
