method: clip_early_fusion

model:
  name: ViT-L/14
  checkpoint: checkpoints/clip/ViT-L-14.pt

cache:
  gallery_features: runs/clip_image/gallery_features_vit_l14.npy

fusion:
  image_weight: 0.5
  text_weight: 0.5

runtime:
  device: cuda
  batch_size: 64
  text_batch_size: 256
  score_batch_size: 512
  num_workers: 4

output:
  dir: runs/clip_early_fusion
