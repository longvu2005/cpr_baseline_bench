method: imagine_seek
display_name: Imagine and Seek (IP-CIR, official-source CPR adapter)
group: Published / SOTA Baselines
cpr_supervision: 'No'

paper:
  title: 'Imagine and Seek: Improving Composed Image Retrieval with an Imagined Proxy'
  venue: CVPR 2025
  arxiv: '2411.16752'
  implementation_status: OFFICIAL_SOURCE_ADAPTED

author_source:
  repository: https://github.com/LeyRio/Imagine-and-Seek.git
  commit: 2f615824bd7a6958083c85d8ad5e5e20549e22cb
  local_checkout: runs/imagine_seek/official_source/Imagine-and-Seek
  auto_clone: true
  # The released project is adapted only at its dataset/path boundary and proxy masking boundary.
  # We reuse its MIGC + ELITE implementation, mapper classes and generation function.
  adaptation: cpr_full_scene_reference_mask

base_retriever:
  method: lincir
  method_dir: methods/published/05_lincir
  config: methods/published/05_lincir/config.yaml
  scores: runs/lincir/scores.npy
  gallery_features: runs/lincir/cache/gallery_features.npy
  clip_snapshot: checkpoints/lincir/hf/clip-vit-large-patch14
  projection_dim: 768
  auto_prepare: true
  auto_run: true

proxy:
  mode: generate
  count_per_query: 5
  aggregation: mean_feature_then_robust
  manifest: runs/imagine_seek/cache/proxy_manifest.jsonl
  image_dir: runs/imagine_seek/cache/proxies
  jobs: runs/imagine_seek/cache/proxy_jobs.jsonl
  # Direct full-scene CPR adaptation: ELITE receives the complete reference scene as
  # the visual concept for every image-referenced subject. No GT target box/identity is used.
  reference_mask: full_scene

captioner:
  repo_id: Salesforce/blip2-opt-2.7b
  revision: main
  local_snapshot: checkpoints/imagine_seek/hf/blip2-opt-2.7b
  captions_per_query: 5
  max_new_tokens: 48
  do_sample: true
  top_p: 0.92
  temperature: 0.85

layout_llm:
  # The released IP-CIR project primarily reports Qwen1.5-32B-Chat-GPTQ-Int4.
  # AutoGPTQ is brittle on Kaggle/Python 3.12, so this default uses the same Qwen1.5
  # family with bitsandbytes 4-bit. Change repo_id to Qwen/Qwen1.5-14B-Chat or
  # Qwen/Qwen1.5-32B-Chat if your GPU/storage allows it.
  repo_id: Qwen/Qwen1.5-7B-Chat
  revision: 5f4f5e69ac7f1d508f8369e977de208b4803444b
  local_snapshot: checkpoints/imagine_seek/hf/Qwen1.5-7B-Chat
  max_new_tokens: 900
  do_sample: false
  temperature: 0.0
  target_captions_per_query: 5
  load_in_4bit: true

migc:
  checkpoint: checkpoints/imagine_seek/weights/MIGC_SD14.ckpt
  google_drive_id: 107fnQ9Fpu5K0UtqnHlKja7hqe-GwjAmz
  checkpoint_status: PUBLIC_REIMPLEMENTED_UPSTREAM_WEIGHT
  prepared_marker: checkpoints/imagine_seek/prepared.json
  generation:
    num_inference_steps: 50
    guidance_scale: 7.5
    migc_steps: 25
    naive_fuser_steps: 50
    seed: 42000

elite:
  checkpoint_folder_url: https://drive.google.com/drive/folders/1VkiVZzA_i9gbfuzvHaLH2VYh7kOTzE0x?usp=sharing
  download_dir: checkpoints/imagine_seek/weights/elite_download
  global_mapper: checkpoints/imagine_seek/weights/global_mapper.pt
  local_mapper: checkpoints/imagine_seek/weights/local_mapper.pt
  clip_vision_snapshot: checkpoints/lincir/hf/clip-vit-large-patch14

realistic_vision:
  repo_id: aishuu/Realistic_Vision_V6.0_B1VAE
  revision: main
  filename: realisticVisionV60B1_v60B1VAE.safetensors
  path: checkpoints/imagine_seek/weights/realisticVisionV60B1_v60B1VAE.safetensors
  sha256: e5f3cbc5f7669457d3bec1fd492420995fb9a79e735dce438b81af61fd5d77f0

sd15_components:
  # Needed by diffusers.from_single_file to construct the released Realistic Vision checkpoint offline.
  repo_id: stable-diffusion-v1-5/stable-diffusion-v1-5
  revision: main
  local_snapshot: checkpoints/imagine_seek/hf/stable-diffusion-v1-5-components

representation:
  # Author retrieval code uses the same three-term robust proxy representation:
  # proxy + scaled source feature + scaled semantic direction.
  query_residual_weight: 1.0
  semantic_residual_weight: 1.0
  denominator_epsilon: 1.0e-6
  normalize_proxy_representation: false
  original_caption_reduce: mean_then_normalize
  target_caption_reduce: mean_then_normalize

fusion:
  # Released source default: 0.3. No CPR label is used to tune this value.
  lambda_text: 0.3

runtime:
  device: cuda
  caption_dtype: float16
  llm_dtype: float16
  diffusion_dtype: float16
  clip_dtype: float16
  clip_image_batch_size: 32
  clip_text_batch_size: 64
  score_batch_size: 128
  num_workers: 4

data:
  gallery_manifest: data/gallery.jsonl
  query_manifest: data/queries.jsonl

cache:
  captions: runs/imagine_seek/cache/query_captions.jsonl
  layouts: runs/imagine_seek/cache/layouts.jsonl
  proxy_features: runs/imagine_seek/cache/proxy_features.npy
  proxy_features_meta: runs/imagine_seek/cache/proxy_features.meta.json
  query_components: runs/imagine_seek/cache/query_components.npz
  query_components_meta: runs/imagine_seek/cache/query_components.meta.json

output:
  dir: runs/imagine_seek
