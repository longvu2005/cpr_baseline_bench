method: word4per_setmatch
display_name: Word4Per + Partial SetMatch
group: Published / SOTA Baselines
cpr_supervision: 'No'
paper:
  title: 'Word4Per: Zero-shot Composed Person Retrieval'
  arxiv: '2311.16515'
source:
  repository: https://github.com/Delong-liu-bupt/Composed_Person_Retrieval.git
  commit: 0cc16936f031f7ad166be4cce1be33d0b44b728e
  subdir: old_project
  local_checkout: runs/word4per_setmatch/official_source/Composed_Person_Retrieval
  auto_clone: true
checkpoint:
  stage2: checkpoints/word4per/word4per_cuhk_pedes_stage2_best.pth
  stage2_config: checkpoints/word4per/word4per_cuhk_pedes_stage2_configs.yaml
  status: REPRODUCED
  training_dataset: CUHK-PEDES
  num_classes: 11003
  base_clip_model: ViT-B/16
  base_clip: checkpoints/clip/ViT-B-16.pt
runtime:
  device: cuda
  detector_device: cuda
  image_batch_size: 64
  query_batch_size: 128
  score_person_batch_size: 4096
  score_query_batch_size: 256
  num_workers: 4
  gallery_feature_dtype: float16
data:
  gallery_manifest: data/gallery.jsonl
  query_manifest: data/queries.jsonl
localization:
  detector:
    backend: groundingdino_swint_ogc
    source:
      repository: https://github.com/IDEA-Research/GroundingDINO.git
      commit: 856dde20aee659246248e20734ef9ba5214f5e44
      local_checkout: runs/groundingdino_clipreid_set/official_source/GroundingDINO
      auto_clone: true
    config: groundingdino/config/GroundingDINO_SwinT_OGC.py
    config_sha256: 172e80017f9395668a9cb5d1b8bd9d061c0e360471c6ed673c83b69bb14399f1
    checkpoint: checkpoints/groundingdino/groundingdino_swint_ogc.pth
    checkpoint_url: https://github.com/IDEA-Research/GroundingDINO/releases/download/v0.1.0-alpha/groundingdino_swint_ogc.pth
    runtime_cache: checkpoints/groundingdino/runtime_cache
    runtime_assets_marker: checkpoints/groundingdino/runtime_assets_ready.json
    text_prompt: person
    box_threshold: 0.35
    text_threshold: 0.25
    score_threshold: 0.35
    nms_iou_threshold: 0.5
    min_box_size_px: 4
    max_persons_per_image: 10
    batch_size: 2
    max_padding_ratio: 1.3
    attention_backend: official_pytorch_fallback
  query_selector:
    backend: openai_clip
    model: ViT-B/32
    source_commit: a1d071733d7111c9c014f024669f959182114e33
    checkpoint: checkpoints/clip/ViT-B-32.pt
    checkpoint_sha256: 40d365715913c9da98579312b702a82c18be219cc2a73407c4526f58eba950af
    checkpoint_url: https://openaipublic.azureedge.net/clip/models/40d365715913c9da98579312b702a82c18be219cc2a73407c4526f58eba950af/ViT-B-32.pt
    membership_threshold: 0.2
    membership_margin: 0.03
    max_members_per_subject: 5
    tokenize_truncate: true
    assignment: hungarian_anchors_then_disjoint_expansion
    tokenizer_packages:
      ftfy: '5.8'
      wcwidth: 0.2.13
    tokenizer_runtime_dir: checkpoints/clip/selector_tokenizer
setmatch:
  enabled: true
  assignment: hungarian_max_sum
  aggregation: mean
  unmatched_score: -1.0
  unmatched_score_source: analytic_lower_bound_of_normalized_cosine_or_token_cosine
output:
  dir: runs/word4per_setmatch
person_protocol: cpr_person/protocol.yaml
