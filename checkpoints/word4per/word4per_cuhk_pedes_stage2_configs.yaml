# Word4Per Stage-2 configuration
# Reconstructed from the authors' official CUHK-PEDES Stage-2 recipe.

name: word4per
dataset_name: CUHK-PEDES

# Backbone
pretrain_choice: ViT-B/16
img_size: [384, 128]
stride_size: 16
temperature: 0.02

# Word4Per / TINet
mlp_depth: 2

# Text
text_length: 77
vocab_size: 49408

# Architecture required by the released training recipe
loss_names: sdm+id+mlm
cmt_depth: 4
masked_token_rate: 0.8
masked_token_unchanged_rate: 0.1
mlm_loss_weight: 1.0
id_loss_weight: 1.0

# Stage-2 training recipe metadata
toword_loss: text
MLM: true
img_aug: true
batch_size: 128
test_batch_size: 512
optimizer: AdamW
lr: 0.0001
num_epoch: 60
num_workers: 8
